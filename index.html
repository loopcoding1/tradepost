<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="zARoLIdARuieH0j9vKh2-yKBDaKnd0sm-eSMbTpjf60" />

  <title>TRADEPOST TCG</title>
  <meta name="description" content="TRADEPOST TCG official landing page and contact portal.">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Light */
    .glow-circle {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(56, 189, 248, 0.05) 50%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3rem 2.25rem;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
    }

    /* Brand Logo / Icon */
    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.75rem;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(56, 189, 248, 0.15) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
      color: var(--cyan);
    }

    /* Typography */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    h1 span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    /* Contact Box */
    .contact-card {
      background: rgba(10, 15, 29, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .contact-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .contact-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--text-muted);
    }

    .email-link {
      color: #ffffff;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    .email-link:hover {
      color: var(--cyan);
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      transform: translateY(-1px);
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Verification Badge */
    .verification-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 2rem;
      padding: 0.35rem 0.85rem;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #34d399;
    }

    .verification-badge svg {
      width: 14px;
      height: 14px;
    }

    /* Footer */
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      background: #10b981;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Ambient light -->
  <div class="glow-circle"></div>

  <!-- Main Card Container -->
  <div class="container">
    <!-- Brand Icon -->
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="14" height="18" x="5" y="3" rx="3" ry="3"/>
        <path d="m9 8 6 4-6 4Z"/>
      </svg>
    </div>

    <!-- Company Name -->
    <h1>TRADEPOST <span>TCG</span></h1>
    <p class="tagline">Trading Card Game & Collector Services</p>

    <!-- Clean Contact Card -->
    <div class="contact-card">
      <span class="contact-label">Official Contact</span>
      <a href="mailto:bnoge0599@gmail.com" class="email-link" id="email-address">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
        <span>bnoge0599@gmail.com</span>
      </a>

      <div class="btn-group">
        <a href="mailto:bnoge0599@gmail.com" class="btn btn-primary">
          Send Email
        </a>
        <button class="btn btn-copy" id="copy-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          <span id="copy-text">Copy</span>
        </button>
      </div>
    </div>

    <!-- Google Site Verification Status -->
    <div class="verification-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span>Google Site Verified</span>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2026 TRADEPOST TCG. All rights reserved.</p>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const copyBtn = document.getElementById('copy-btn');
    const copyText = document.getElementById('copy-text');
    const toast = document.getElementById('toast');

    copyBtn.addEventListener('click', async () => {
      const email = 'bnoge0599@gmail.com';
      try {
        await navigator.clipboard.writeText(email);
      } catch (e) {
        const input = document.createElement('input');
        input.value = email;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
      }

      copyText.textContent = 'Copied!';
      toast.classList.add('show');
      setTimeout(() => {
        copyText.textContent = 'Copy';
        toast.classList.remove('show');
      }, 2500);
    });
  </script>
</body>
</html>
